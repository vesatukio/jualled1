<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Affiliate Content Generator | Duta LED</title><style>body{font-family:Arial;margin:0;background:#f5f6f8;color:#222}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:#fff;padding:16px;border-radius:14px;margin-bottom:14px;box-shadow:0 2px 10px #0001}input,textarea,select,button{width:100%;box-sizing:border-box;padding:11px;margin:5px 0;border:1px solid #ddd;border-radius:9px;font:inherit}button{background:#ff7200;color:white;border:0;font-weight:bold;cursor:pointer}.secondary{background:#eee;color:#222}.out{white-space:pre-wrap;background:#fafafa;border:1px solid #ddd;padding:12px;border-radius:9px;margin-top:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hint{font-size:12px;color:#777}.ok{color:#187a36;font-weight:bold}.err{color:#b00020;font-weight:bold}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><h2>🛍️ Affiliate Content Generator</h2><p>Produk affiliate dibaca dari sheet <b>AFFILIATE</b>.</p><button type="button" onclick="loadProducts()">🔄 Muat Produk Affiliate dari Google Sheet</button><select id="products"><option value="">-- pilih produk --</option></select><small id="status"></small><hr><label>🔗 Atau tempel Link Affiliate Shopee</label><input id="shopeeLink" placeholder="https://s.shopee.co.id/qj4FPYO26"><button type="button" class="secondary" onclick="useShopeeLink()">📌 Gunakan Link Shopee</button><div class="hint">Link Shopee pendek tetap digunakan sebagai link affiliate. Detail produk harus berasal dari sheet atau diisi manual.</div></div><div class="card"><input id="name" placeholder="Nama produk"><div class="row"><input id="price" placeholder="Harga"><input id="old" placeholder="Harga coret"></div><input id="link" placeholder="Link affiliate"><input id="cat" placeholder="Kategori"><textarea id="desc" placeholder="Keunggulan / spesifikasi"></textarea><input id="image" placeholder="URL gambar (opsional)"><input id="target" value="pemilik rumah, kos, toko" placeholder="Target pembeli"><select id="tone"><option>Menjual tapi natural</option><option>Singkat dan langsung</option><option>Problem-solution</option><option>Promo / harga murah</option></select><button onclick="generate()">✨ Generate Konten</button></div><div class="card" id="out" style="display:none"><h3>📝 Hasil</h3><div id="results"></div></div></div><script>const API='https://script.google.com/macros/s/AKfycbyr4eSauu1RneZIrwwPVBilx21kWNrauE9V40D17dmrntqTu4U3OGi4fafAYHXcd-A/exec';let ps=[];const $=x=>document.getElementById(x),v=x=>String($(x).value||'').trim();const norm=x=>String(x??'').trim().toLowerCase().replace(/[\s_\-]+/g,'');function pick(r,keys){const entries=Object.entries(r||{});for(const k of keys){const want=norm(k);const hit=entries.find(([a,b])=>norm(a)===want&&String(b??'').trim());if(hit)return hit[1]}return ''}function rowsFrom(d){if(Array.isArray(d))return d;if(Array.isArray(d?.data))return d.data;if(Array.isArray(d?.rows))return d.rows;if(Array.isArray(d?.products))return d.products;if(Array.isArray(d?.result))return d.result;if(Array.isArray(d?.values)){const h=d.headers||d.values[0];const vals=d.headers?d.values:d.values.slice(1);return h?vals.map(row=>Object.fromEntries(h.map((k,i)=>[k,row[i]??'']))):[]}return []}function aff(r){const f=String(pick(r,['affiliate'])||'').toLowerCase(),l=String(pick(r,['linkAffiliate','link affiliate','link shopee','link'])||'');const active=String(pick(r,['aktif','active'])||'ya').toLowerCase();return (f===''||/^(ya|yes|true|1|affiliate|shopee)$/.test(f)||f.includes('affiliate'))&&active!=='tidak'&&active!=='false'&&active!=='0'&&/(shopee|tiktok|lazada|tokopedia)/i.test(l)}async function loadProducts(){const s=$('status');s.className='';s.textContent=' Memuat sheet AFFILIATE...';try{const r=await fetch(API+'?sheet=AFFILIATE&t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();const rows=rowsFrom(d);ps=rows.filter(aff).map(r=>({name:pick(r,['nama','nama produk','name','product name']),price:pick(r,['harga','harga jual','price']),old:pick(r,['hargaCoret','harga coret','harga normal','oldPrice']),link:pick(r,['linkAffiliate','link affiliate','link shopee','link','url']),cat:pick(r,['kategori','category']),desc:pick(r,['deskripsi','spesifikasi','features']),image:pick(r,['gambar','image','foto','image url'])})).filter(x=>x.name&&x.link);$('products').innerHTML='<option value="">-- pilih produk --</option>'+ps.map((p,i)=>`<option value="${i}">${p.name}</option>`).join('');s.className='ok';s.textContent=' Ditemukan '+ps.length+' produk affiliate dari sheet AFFILIATE.'}catch(e){s.className='err';s.textContent=' Gagal membaca sheet AFFILIATE: '+e.message+'. Pastikan endpoint Apps Script mendukung parameter sheet=AFFILIATE.'}}$('products').onchange=()=>{const p=ps[+$('products').value];if(!p)return;$('name').value=p.name;$('price').value=p.price;$('old').value=p.old;$('link').value=p.link;$('cat').value=p.cat||'produk pilihan';$('desc').value=p.desc||'';$('image').value=p.image||''};function useShopeeLink(){const l=v('shopeeLink');if(!l)return alert('Tempel link affiliate Shopee terlebih dahulu.');if(!/(shopee\.co\.id|shopee\.id|shopee\.com)/i.test(l))return alert('Link tersebut bukan link Shopee yang dikenali.');$('link').value=l;$('status').textContent=' Link Shopee siap digunakan. Isi nama/harga produk lalu Generate Konten.';$('name').focus()}function rp(x){const n=String(x||'').replace(/[^0-9]/g,'');return n?'Rp'+Number(n).toLocaleString('id-ID'):'Harga cek link'}function generate(){const n=v('name');if(!n)return alert('Pilih atau isi produk.');const p=rp(v('price')),o=rp(v('old')),l=v('link')||v('shopeeLink')||'[LINK AFFILIATE]',d=v('desc')||'praktis dan mudah digunakan',t=v('target')||'calon pembeli',c=(v('cat')||'produk').toLowerCase().replace(/[^a-z0-9]+/g,''),harga=o!=='Harga cek link'&&o!==p?`💰 Sekarang ${p} (sebelumnya ${o})`:`💰 ${p}`,fb=`🔥 Lagi cari ${n}?\n\n${harga}\n\n${d}\n\nCocok untuk ${t}.\n\n🛒 Cek produk:\n${l}\n\n#${c} #affiliate #rekomendasi`,tt=`💡 ${n}\n\n${d}\n\n${harga}\n\nKalau kamu ${t}, produk ini layak dicek.\n\n👉 ${l}\n\n#fyp #racunbelanja #${c}`,wa=`🛍️ ${n}\n\n${harga}\n${d}\n\n👉 Cek di sini:\n${l}`,script=`HOOK: Jangan lewatkan ${n}!\n\nSOLUSI: ${d}.\n\nHARGA: ${harga}\n\nCTA: Cek detail di ${l}`;show([['Facebook',fb],['TikTok',tt],['WhatsApp',wa],['Judul Produk',`${n} | ${p} | ${v('cat')}`],['Script Video',script]])}function show(a){$('out').style.display='block';$('results').innerHTML=a.map((x,i)=>`<div class="out"><b>${x[0]}</b><br><span id="x${i}"></span><br><button onclick="navigator.clipboard.writeText(document.getElementById('x${i}').innerText)">Copy</button></div>`).join('');a.forEach((x,i)=>$('x'+i).textContent=x[1]);$('out').scrollIntoView({behavior:'smooth'})}</script></body></html>
