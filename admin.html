<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Produk | Duta LED</title><link rel="stylesheet" href="admin.css"></head><body><main class="admin-wrap"><header class="admin-head"><div><small>DUTA LED</small><h1>Kelola Produk</h1><p>Tambah, edit harga, stok, dan gambar dari HP.</p></div><a href="index.html" class="back">← Toko</a></header><section class="toolbar"><input id="adminSearch" type="search" placeholder="Cari produk..."><button id="addProduct" class="primary">＋ Tambah Produk</button></section><div id="message" class="message hidden"></div><section id="productList" class="product-list"></section></main><div id="editor" class="modal hidden"><div class="backdrop"></div><section class="sheet"><header><div><small id="editorMode">PRODUK</small><h2 id="editorTitle">Tambah Produk</h2></div><button id="closeEditor" class="icon">×</button></header><form id="productForm"><input type="hidden" name="id"><label>Nama Produk<input name="nama" required></label><label>Kategori<input name="kategori" placeholder="Modul LED, Fitting, DOB..."></label><div class="two"><label>Harga Jual<input name="hargaJual" type="number" min="0" inputmode="numeric" required></label><label>Harga Diskon<input name="hargaDiskon" type="number" min="0" inputmode="numeric"></label></div><div class="two"><label>Diskon (%)<input name="diskon" type="number" min="0" max="99" inputmode="numeric"></label><label>Stok<input name="stok" type="number" min="0" inputmode="numeric"></label></div><label>Gambar 1 <span>utama</span><input name="gambar1" type="url" placeholder="https://..."></label><div class="image-preview" data-preview="gambar1"></div><label>Gambar 2<input name="gambar2" type="url" placeholder="https://..."></label><div class="image-preview" data-preview="gambar2"></div><label>Gambar 3<input name="gambar3" type="url" placeholder="https://..."></label><div class="image-preview" data-preview="gambar3"></div><label>Deskripsi<textarea name="deskripsi" rows="5" placeholder="Tulis deskripsi produk..."></textarea></label><button class="primary save" type="submit">Simpan Produk</button></form></section></div><script src="admin.js"></script></body></html>
