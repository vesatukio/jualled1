<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Admin Produk | Duta LED</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#182230;font-family:Arial,sans-serif}.wrap{max-width:920px;margin:auto;padding:16px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.brand small{color:#1769e0;font-weight:800}.brand h1{font-size:23px;margin:4px 0}.brand p{margin:0;color:#6b7585;font-size:13px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#1769e0;color:#fff}.light{background:#fff;border:1px solid #dce2e9;text-decoration:none;color:#182230}.toolbar{display:flex;gap:9px;margin-bottom:14px}.search{flex:1;padding:12px 14px;border:1px solid #d9dfe8;border-radius:10px;font-size:14px;background:#fff}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid #e1e6ed;border-radius:14px;padding:12px;display:grid;grid-template-columns:82px 1fr;gap:12px}.photo{width:82px;height:82px;border-radius:10px;object-fit:cover;background:#eef1f5}.name{font-weight:800;font-size:15px}.cat{font-size:12px;color:#778294}.prices{margin-top:8px;font-size:13px}.normal{text-decoration:line-through;color:#8993a2;margin-right:7px}.sale{font-weight:800}.disc{margin-left:6px;color:#d92d20;font-weight:800;font-size:12px}.edit{grid-column:1/-1;width:100%;padding:10px;border-radius:9px;background:#f1f6ff;color:#1769e0;border:1px solid #cfe0ff;font-weight:800;cursor:pointer}.empty{text-align:center;background:#fff;border:1px dashed #d8dee7;border-radius:12px;padding:30px;color:#737e8e;grid-column:1/-1}.hidden{display:none!important}.msg{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#182230;color:#fff;padding:11px 16px;border-radius:10px;z-index:10000}.overlay{position:fixed;inset:0;background:#0008;z-index:40;display:flex;align-items:flex-end;justify-content:center}.modal{background:#fff;width:min(680px,100%);max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.close{border:0;background:#f0f2f5;width:36px;height:36px;border-radius:50%;font-size:21px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#4d5868}.field input,.field textarea{width:100%;padding:10px;border:1px solid #d8dee7;border-radius:9px;font-size:14px}.field textarea{min-height:90px}.auto{padding:10px;border-radius:9px;background:#fff5e7;color:#a05c00;font-weight:800}.preview{width:72px;height:72px;border-radius:9px;object-fit:cover;margin-top:4px}.actions{display:flex;gap:9px;justify-content:flex-end;padding-top:14px;margin-top:12px;border-top:1px solid #edf0f4}.login{position:fixed;inset:0;width:100%;height:100%;background:#f4f6f9;z-index:99999;display:flex;align-items:center;justify-content:center;padding:18px;pointer-events:auto}.loginbox{background:#fff;width:min(380px,100%);padding:24px;border-radius:16px;border:1px solid #e0e5ec;box-shadow:0 8px 30px #0002;position:relative;z-index:100000;pointer-events:auto}.loginbox h2{margin:0 0 5px}.loginbox p{color:#6d7787;font-size:13px;margin:0 0 16px}.loginbox input{display:block;width:100%;height:50px;padding:12px 14px;border:2px solid #d8dee7;border-radius:9px;margin:0 0 10px;font-size:16px;background:#fff;color:#182230;outline:none;pointer-events:auto;user-select:text;-webkit-user-select:text}.loginbox input:focus{border-color:#1769e0;box-shadow:0 0 0 3px #1769e022}.loginbox button{width:100%}@media(max-width:650px){.wrap{padding:12px}.list{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}.toolbar .btn{flex:1}}
</style></head>
<body>
<div id="login" class="login"><div class="loginbox"><h2>🔐 Admin Duta LED</h2><p>Ketik kunci admin untuk membuka halaman pengelolaan produk.</p><input id="adminKey" name="adminKey" type="password" autocomplete="current-password" inputmode="text" placeholder="Ketik kunci admin" aria-label="Kunci admin"><button id="loginBtn" type="button" class="btn primary">Masuk Admin</button></div></div>
<main class="wrap"><header class="head"><div class="brand"><small>DUTA LED</small><h1>Kelola Produk</h1><p>Edit produk lama atau tambah produk baru.</p></div><a href="index.html" class="btn light">← Toko</a></header><div class="toolbar"><input id="adminSearch" class="search" type="search" placeholder="🔍 Cari nama atau kategori..."><button id="addProduct" type="button" class="btn primary">＋ Tambah Produk</button></div><section id="productList" class="list"></section></main>
<div id="message" class="msg hidden"></div><div id="editor" class="overlay hidden"><div class="modal"><div class="modal-head"><h2 id="editorTitle">Tambah Produk</h2><button id="closeEditor" type="button" class="close">×</button></div><form id="productForm"><input type="hidden" name="id"><div class="grid"><div class="field full"><label>Nama Produk *</label><input name="nama" required></div><div class="field"><label>Kategori</label><input name="kategori"></div><div class="field"><label>Harga Modal</label><input name="hargaModal" type="number" min="0"></div><div class="field"><label>Laba</label><input name="laba" placeholder="30%"></div><div class="field"><label>Harga Jual</label><input name="hargaJual" type="number" min="0"></div><div class="field"><label>Harga Diskon</label><input name="hargaDiskon" type="number" min="0"></div><div class="field full"><label>Diskon Otomatis</label><div id="autoDiscount" class="auto">0%</div></div><div class="field full"><label>Gambar 1</label><input name="gambar1" type="url"><img class="preview" data-preview="gambar1"></div><div class="field"><label>Gambar 2</label><input name="gambar2" type="url"><img class="preview" data-preview="gambar2"></div><div class="field"><label>Gambar 3</label><input name="gambar3" type="url"><img class="preview" data-preview="gambar3"></div><div class="field full"><label>Deskripsi</label><textarea name="deskripsi"></textarea></div></div><div class="actions"><button type="button" id="cancel" class="btn light">Batal</button><button type="submit" id="saveBtn" class="btn primary">💾 Simpan Produk</button></div></form></div></div>
<script src="admin.js?v=20260829-3"></script></body></html>
