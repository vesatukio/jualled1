<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Admin Produk | Duta LED</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#182230;font-family:Arial,sans-serif}.admin-wrap{max-width:900px;margin:auto;padding:16px}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.admin-head small{font-weight:800;color:#1769e0}.admin-head h1{margin:4px 0;font-size:23px}.admin-head p{margin:0;color:#697586;font-size:13px}.back{background:#fff;border:1px solid #dce2e9;border-radius:9px;padding:10px 13px;text-decoration:none;color:#182230;font-weight:700}.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar input{flex:1;min-width:0;padding:12px;border:1px solid #d8dee8;border-radius:10px;font-size:14px}.primary{border:0;background:#1769e0;color:#fff;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}.message{padding:11px 13px;background:#eaf7ee;border-radius:9px;margin-bottom:12px}.hidden{display:none}.bulk-info{background:#fff;border:1px solid #e3e7ed;border-radius:10px;padding:12px;margin-bottom:12px;font-size:13px;color:#5d6878}.table-wrap{background:#fff;border:1px solid #e0e5ec;border-radius:12px;overflow:auto}.table-wrap table{border-collapse:collapse;width:100%;min-width:1050px}.table-wrap th{background:#f7f8fa;text-align:left;font-size:12px;color:#596579;position:sticky;top:0}.table-wrap th,.table-wrap td{padding:8px;border-bottom:1px solid #edf0f4;vertical-align:top}.table-wrap input,.table-wrap textarea{width:100%;min-width:95px;padding:8px;border:1px solid #dce1e8;border-radius:7px;font-size:13px}.table-wrap textarea{min-height:55px}.table-wrap input[name="diskon"]{background:#fff4e5;font-weight:700;color:#a15c00}.thumb{width:54px;height:54px;object-fit:cover;border-radius:8px;background:#eee}.new-row{background:#f9fbff}@media(max-width:600px){.admin-wrap{padding:12px}.admin-head{align-items:flex-start}.admin-head h1{font-size:19px}.toolbar{flex-wrap:wrap}.toolbar input{flex-basis:100%}.toolbar button{flex:1}.table-wrap table{min-width:1000px}}
</style></head>
<body><main class="admin-wrap">
<header class="admin-head"><div><small>DUTA LED</small><h1>Kelola Produk</h1><p>Edit produk lama atau tambah produk baru.</p></div><a href="index.html" class="back">← Toko</a></header>
<section class="toolbar"><input id="adminSearch" type="search" placeholder="🔍 Cari produk..."><button id="addRows" class="primary">＋ Tambah Produk</button><button id="saveAll" class="primary">💾 Simpan</button></section>
<div id="message" class="message hidden"></div>
<section class="bulk-info">💡 Harga Coret + Harga Jual akan menghitung <b>diskon otomatis</b>. Edit produk lama langsung di tabel.</section>
<div class="table-wrap"><table id="productTable"><thead><tr><th>Foto</th><th>Nama</th><th>Kategori</th><th>Harga Coret</th><th>Harga Jual</th><th>Diskon</th><th>Stok</th><th>Gambar 1</th><th>Gambar 2</th><th>Gambar 3</th><th>Deskripsi</th></tr></thead><tbody id="productBody"></tbody></table></div>
</main><script src="admin.js"></script></body></html>
