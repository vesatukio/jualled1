<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Duta Terang - Toko Online Elektronik & Sparepart</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ee4d2d">
  
  <!-- CSS Dependencies -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="light-mode">

  <!-- Header Sticky -->
  <header class="app-header fixed-top">
    <div class="container-fluid d-flex align-items-center justify-content-between py-2 px-3">
      <a href="#" class="brand-logo fw-bold text-decoration-none">Duta Terang</a>
      <div class="search-box flex-grow-1 mx-2">
        <div class="input-group input-group-sm">
          <span class="input-group-text bg-white border-end-0"><span class="material-symbols-rounded">search</span></span>
          <input type="text" id="searchInput" class="form-control border-start-0 ps-0" placeholder="Cari sparepart, LED, audio...">
        </div>
      </div>
      <div class="header-actions d-flex align-items-center gap-2">
        <button class="btn btn-sm p-0 position-relative" id="cartBtn">
          <span class="material-symbols-rounded fs-5">shopping_cart</span>
          <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.6rem;">0</span>
        </button>
        <button class="btn btn-sm p-0" id="themeToggle"><span class="material-symbols-rounded fs-5">dark_mode</span></button>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="app-main container py-3 mt-5 mb-5" id="appContainer">
    <!-- Dynamic View Loaded via JS -->
    <div id="homeView" class="view-section">
      <!-- Banner Slider -->
      <div class="swiper bannerSwiper mb-3 rounded-4 overflow-hidden shadow-sm">
        <div class="swiper-wrapper" id="bannerWrapper">
          <!-- Dynamically populated -->
        </div>
        <div class="swiper-pagination"></div>
      </div>

      <!-- Categories Grid -->
      <div class="category-grid mb-3" id="categoryContainer">
        <!-- Dynamically populated -->
      </div>

      <!-- Flash Sale -->
      <div class="flash-sale-card p-3 rounded-4 mb-3 shadow-sm">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="fw-bold m-0 text-danger d-flex align-items-center gap-1"><span class="material-symbols-rounded">bolt</span> Flash Sale</h6>
          <div id="countdownTimer" class="badge bg-danger">00:00:00</div>
        </div>
        <div class="swiper flashSwiper">
          <div class="swiper-wrapper" id="flashSaleWrapper"></div>
        </div>
      </div>

      <!-- Product Feed -->
      <h6 class="fw-bold mb-2">Rekomendasi Untuk Anda</h6>
      <div class="row g-2" id="productGrid">
        <!-- Skeleton Loading initial state -->
        <div class="col-6"><div class="skeleton-card"></div></div>
        <div class="col-6"><div class="skeleton-card"></div></div>
      </div>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav fixed-bottom bg-body border-top shadow-lg">
    <div class="d-flex justify-around align-items-center py-2">
      <a href="#" class="nav-item active" data-target="homeView"><span class="material-symbols-rounded">home</span><small>Beranda</small></a>
      <a href="#" class="nav-item" data-target="categoryView"><span class="material-symbols-rounded">grid_view</span><small>Kategori</small></a>
      <a href="#" class="nav-item" data-target="cartView"><span class="material-symbols-rounded">shopping_bag</span><small>Keranjang</small></a>
      <a href="#" class="nav-item" data-target="orderView"><span class="material-symbols-rounded">receipt_long</span><small>Pesanan</small></a>
      <a href="#" class="nav-item" data-target="accountView"><span class="material-symbols-rounded">person</span><small>Akun</small></a>
    </div>
  </nav>

  <!-- JS Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="app.js"></script>
</body>
</html>
