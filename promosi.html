<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Promosi | Duta LED</title><meta id="metaDescription" name="description" content="Halaman promosi usaha."><meta property="og:type" content="website"><meta id="ogTitle" property="og:title" content="Promosi"><meta id="ogDescription" property="og:description" content="Halaman promosi usaha."><meta id="ogImage" property="og:image" content=""><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="publikasi.css"></head><body><header class="header"><div class="container header-inner"><a href="index.html" class="brand"><div class="brand-logo">D</div><div class="brand-info"><strong>Duta LED Platform</strong><small>Halaman Promosi</small></div></a><a href="publikasi.html" class="header-button">Buat Promosi</a></div></header><main><section class="publish-hero"><div class="container"><span id="promoType" class="eyebrow">PROMOSI</span><h1 id="promoName">Memuat...</h1><p id="promoDesc"></p><div id="promoPrice"></div><p id="promoLocation"></p><a id="promoWA" class="btn green" href="#">💬 Hubungi / Pesan</a></div></section><section class="seo-info"><div class="container"><h2>Informasi</h2><img id="promoImage" style="max-width:100%;max-height:500px;border-radius:12px;object-fit:contain" alt=""><div class="share-info"><span>📘 Facebook</span><span>🎵 TikTok</span><span>💬 WhatsApp</span><span>🔎 Google</span></div></div></section></main><footer class="footer"><strong>Duta LED Platform</strong><span>Halaman promosi publik</span></footer><script>(function(){const q=new URLSearchParams(location.search),raw=q.get('data');if(!raw){promoName.textContent='Data promosi tidak ditemukan';return}let d;try{d=JSON.parse(decodeURIComponent(raw))}catch(e){promoName.textContent='Data promosi tidak valid';return}document.title=d.nama+' | Promosi';promoType.textContent=(d.kategori||d.type||'PROMOSI').toUpperCase();promoName.textContent=d.nama||'';promoDesc.textCo
