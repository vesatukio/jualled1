<section class="promo-admin" id="promoAdminPanel">
  <h3>🖼️ Promo Header</h3>
  <form id="promoHeaderForm" class="promo-admin-form">
    <input id="promoImageUrl" type="url" placeholder="Link gambar (https://...)" autocomplete="off">
    <input id="promoImageFile" type="file" accept="image/*">
    <img id="promoImagePreview" class="promo-admin-preview" alt="Preview" hidden>
    <input id="promoTitle" type="text" placeholder="Judul promo (opsional)">
    <input id="promoLink" type="url" placeholder="Link tujuan saat gambar diklik (opsional)">
    <button type="submit">+ Tambah Promo</button>
  </form>
  <div id="promoHeaderList" style="margin-top:12px"></div>
  <small style="display:block;margin-top:8px;color:#777">Gambar boleh upload langsung (maks. 2 MB) atau pakai link gambar. Slide berganti otomatis setiap 4 detik.</small>
</section>
